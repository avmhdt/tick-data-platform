[project]
name = "tickdb"
version = "0.1.0"
description = "Tick capture, storage and query platform: Parquet archive, ClickHouse, data-quality checks and a Polars/Arrow client."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "clickhouse-connect>=0.8",
    "duckdb>=1.1",
    "httpx>=0.27",
    "ntplib>=0.4",
    "orjson>=3.10",
    "polars>=1.10",
    "prometheus-client>=0.20",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "websockets>=14.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
tickdb = "tickdb.cli:app"

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "hypothesis>=6.100",
    "mkdocs-material>=9.5",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickdb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "ntplib", "clickhouse_connect", "clickhouse_connect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a running ClickHouse (CI service container or make up)",
    "live: connects to real venues (local only)",
    "data: needs captured data under DATA_ROOT (local only)",
    "bench: benchmark runs (local only)",
]
addopts = "-m 'not live and not data and not bench'"

[tool.coverage.run]
source = ["tickdb"]
omit = ["*/tickdb/kdb/*", "*/tickdb/api/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
