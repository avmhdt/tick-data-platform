global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  # Shared-capture mode: the exporter stands in for the ingestors (one shared crypto capture,
  # docs/decisions.md M5). The instance label names what it watches.
  - job_name: tickdb-ingest
    static_configs:
      - targets: ["exporter:9108"]
        labels: {instance: shared-capture}
